<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1a1030" />
<title>Zaia</title>
<style>
  :root{
    --bg:#160e29;
    --bg2:#1e1440;
    --card:rgba(45,28,82,0.55);
    --card-solid:#241546;
    --stroke:rgba(180,140,255,0.18);
    --txt:#f3ecff;
    --txt-dim:#b9a8e0;
    --roxo:#8b5cf6;
    --magenta:#d946ef;
    --laranja:#fb7137;
    --laranja-claro:#fbbf24;
    --urgente:#fb5a6a;
    --importante:#fbbf24;
    --tranquilo:#4ade80;
    --sombra:0 18px 50px -18px rgba(0,0,0,0.65);
    font-synthesis:none;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--txt);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit}

  /* ---------- CENA ENTERGALACTIC ---------- */
  .ceu{position:fixed;inset:0;z-index:-2;overflow:hidden}
  .ceu svg{width:100%;height:100%;display:block}
  .grao{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0.05;
    background-image:repeating-linear-gradient(115deg,#fff 0,#fff 1px,transparent 1px,transparent 4px)}

  /* ---------- LOGIN ---------- */
  .login-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{width:100%;max-width:380px;background:var(--card);
    border:1px solid var(--stroke);border-radius:26px;padding:34px 28px;
    backdrop-filter:blur(18px);box-shadow:var(--sombra);text-align:center}
  .marca{font-size:44px;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(100deg,var(--laranja-claro),var(--magenta),var(--roxo));
    -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:2px}
  .marca-sub{color:var(--txt-dim);font-size:14px;margin-bottom:26px}
  .campo{width:100%;background:rgba(0,0,0,0.25);border:1px solid var(--stroke);
    border-radius:14px;padding:13px 15px;color:var(--txt);font-size:15px;margin-bottom:12px;outline:none;transition:.2s}
  .campo:focus{border-color:var(--magenta);box-shadow:0 0 0 3px rgba(217,70,239,0.15)}
  .campo::placeholder{color:#8a79b5}
  .btn{width:100%;border-radius:14px;padding:13px;font-size:15px;font-weight:600;transition:.2s;margin-top:4px}
  .btn-primario{background:linear-gradient(100deg,var(--laranja),var(--magenta));color:#fff;
    box-shadow:0 10px 24px -8px rgba(217,70,239,0.6)}
  .btn-primario:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn-google{background:#fff;color:#333;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
  .btn-google:hover{filter:brightness(0.96)}
  .btn-ghost{background:transparent;color:var(--txt-dim);font-size:13px;margin-top:14px}
  .btn-ghost:hover{color:var(--txt)}
  .divisor{display:flex;align-items:center;gap:12px;color:#6b5a95;font-size:12px;margin:16px 0}
  .divisor::before,.divisor::after{content:'';flex:1;height:1px;background:var(--stroke)}
  .erro{color:#ff9db0;font-size:13px;min-height:18px;margin-top:6px}

  /* ---------- APP ---------- */
  .app{max-width:920px;margin:0 auto;padding:0 16px 120px}
  .topo{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:26px 4px 8px}
  .saudacao h1{font-size:24px;font-weight:700;letter-spacing:-.5px}
  .saudacao p{color:var(--txt-dim);font-size:14px;margin-top:2px}
  .menu-user{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .avatar{width:38px;height:38px;border-radius:50%;
    background:linear-gradient(135deg,var(--roxo),var(--magenta));
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
  .icon-btn{width:38px;height:38px;border-radius:12px;background:var(--card);
    border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;font-size:16px}
  .icon-btn:hover{border-color:var(--magenta)}

  /* barra da Zaia */
  .zaia-bar{background:var(--card);border:1px solid var(--stroke);border-radius:20px;
    padding:8px;backdrop-filter:blur(14px);box-shadow:var(--sombra);margin-top:14px;
    display:flex;gap:8px;align-items:center}
  .zaia-bar input{flex:1;background:transparent;border:none;outline:none;color:var(--txt);
    font-size:15px;padding:10px 12px}
  .zaia-bar input::placeholder{color:#8a79b5}
  .zaia-send{width:42px;height:42px;border-radius:14px;flex-shrink:0;
    background:linear-gradient(100deg,var(--laranja),var(--magenta));
    display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
  .zaia-send:hover{filter:brightness(1.1)}
  .zaia-fala{font-size:13.5px;color:var(--laranja-claro);min-height:20px;padding:6px 10px 2px;
    display:flex;align-items:center;gap:7px}
  .zaia-fala.hint{color:var(--txt-dim)}

  /* seções */
  .aba-nav{display:flex;gap:6px;margin:22px 0 16px;background:var(--card);
    border:1px solid var(--stroke);border-radius:16px;padding:5px;backdrop-filter:blur(10px)}
  .aba-nav button{flex:1;padding:10px;border-radius:12px;color:var(--txt-dim);font-size:14px;font-weight:600;transition:.2s}
  .aba-nav button.ativa{background:linear-gradient(100deg,rgba(251,113,55,.9),rgba(217,70,239,.9));color:#fff}

  .sec-titulo{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--txt-dim);
    margin:20px 4px 10px;font-weight:700}

  /* Foco */
  .foco{background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(251,113,55,.15));
    border:1px solid var(--stroke);border-radius:22px;padding:18px 18px 8px;margin-top:16px;backdrop-filter:blur(10px)}
  .foco h2{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:4px}

  /* tarefa */
  .tarefa{display:flex;align-items:flex-start;gap:12px;background:var(--card);
    border:1px solid var(--stroke);border-radius:16px;padding:13px 15px;margin-bottom:9px;
    backdrop-filter:blur(8px);transition:.15s}
  .tarefa:hover{border-color:rgba(217,70,239,.4)}
  .tarefa.feita{opacity:.5}
  .tarefa.feita .t-titulo{text-decoration:line-through}
  .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--txt-dim);flex-shrink:0;margin-top:2px;transition:.15s;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent}
  .check:hover{border-color:var(--magenta)}
  .check.on{background:var(--tranquilo);border-color:var(--tranquilo);color:#0b2a15}
  .t-corpo{flex:1;min-width:0}
  .t-titulo{font-size:15px;font-weight:500;word-wrap:break-word}
  .t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
  .tag{font-size:11.5px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap}
  .tag-urgente{background:rgba(251,90,106,.2);color:var(--urgente)}
  .tag-importante{background:rgba(251,191,36,.18);color:var(--importante)}
  .tag-tranquilo{background:rgba(74,222,128,.16);color:var(--tranquilo)}
  .tag-etiqueta{background:rgba(139,92,246,.2);color:#c4b5fd}
  .tag-prazo{background:rgba(255,255,255,.08);color:var(--txt-dim)}
  .tag-prazo.venc{background:rgba(251,90,106,.22);color:var(--urgente)}
  .t-acoes{display:flex;gap:4px;flex-shrink:0}
  .t-acoes button{width:30px;height:30px;border-radius:9px;color:var(--txt-dim);font-size:14px}
  .t-acoes button:hover{background:rgba(255,255,255,.08);color:var(--txt)}

  .vazio{text-align:center;color:var(--txt-dim);padding:30px 16px;font-size:14px}

  /* projetos */
  .proj{background:var(--card);border:1px solid var(--stroke);border-radius:20px;
    padding:16px 18px;margin-bottom:14px;backdrop-filter:blur(8px)}
  .proj-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .proj-nome{font-size:17px;font-weight:700}
  .proj-prazo{font-size:12.5px;color:var(--txt-dim);margin-top:2px}
  .barra{height:8px;background:rgba(0,0,0,.3);border-radius:20px;overflow:hidden;margin:12px 0}
  .barra span{display:block;height:100%;border-radius:20px;
    background:linear-gradient(90deg,var(--laranja),var(--magenta));transition:width .4s}
  .etapa{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--stroke)}
  .etapa .check{width:19px;height:19px;font-size:10px}
  .etapa-txt{flex:1;font-size:14px}
  .etapa.feita .etapa-txt{text-decoration:line-through;opacity:.55}
  .etapa-prazo{font-size:11.5px;color:var(--txt-dim)}
  .etapa-prazo.venc{color:var(--urgente)}
  .add-etapa{display:flex;gap:8px;margin-top:10px}
  .add-etapa input{flex:1;background:rgba(0,0,0,.25);border:1px solid var(--stroke);
    border-radius:10px;padding:8px 11px;color:var(--txt);font-size:13px;outline:none}
  .add-etapa input.data{flex:0 0 130px}
  .mini-btn{background:rgba(139,92,246,.25);color:#d6c9ff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
  .mini-btn:hover{background:rgba(139,92,246,.4)}

  /* stats */
  .stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
  .stat{background:var(--card);border:1px solid var(--stroke);border-radius:18px;padding:18px;text-align:center;backdrop-filter:blur(8px)}
  .stat .num{font-size:30px;font-weight:800;
    background:linear-gradient(100deg,var(--laranja-claro),var(--magenta));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .stat .lbl{font-size:12.5px;color:var(--txt-dim);margin-top:4px}

  /* FAB */
  .fab{position:fixed;right:20px;bottom:24px;width:58px;height:58px;border-radius:20px;
    background:linear-gradient(135deg,var(--laranja),var(--magenta));color:#fff;font-size:28px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 14px 30px -8px rgba(217,70,239,.7);z-index:40}
  .fab:hover{transform:translateY(-2px) rotate(90deg);transition:.25s}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(10,6,24,.72);backdrop-filter:blur(4px);
    z-index:50;display:none;align-items:flex-end;justify-content:center;padding:0}
  .modal-bg.on{display:flex}
  .modal{width:100%;max-width:480px;background:var(--card-solid);border:1px solid var(--stroke);
    border-radius:24px 24px 0 0;padding:24px 22px calc(24px + env(safe-area-inset-bottom));animation:sobe .25s ease}
  @keyframes sobe{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
  @media(min-width:560px){.modal-bg{align-items:center}.modal{border-radius:24px;margin:20px}}
  .modal h3{font-size:18px;margin-bottom:16px}
  .modal label{display:block;font-size:12.5px;color:var(--txt-dim);margin:12px 0 5px;font-weight:600}
  .modal .campo{margin-bottom:0}
  .prio-pick{display:flex;gap:8px}
  .prio-pick button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--stroke);
    font-size:13px;font-weight:600;color:var(--txt-dim);background:rgba(0,0,0,.2)}
  .prio-pick button.sel[data-p="urgente"]{background:rgba(251,90,106,.25);color:var(--urgente);border-color:var(--urgente)}
  .prio-pick button.sel[data-p="importante"]{background:rgba(251,191,36,.2);color:var(--importante);border-color:var(--importante)}
  .prio-pick button.sel[data-p="tranquilo"]{background:rgba(74,222,128,.18);color:var(--tranquilo);border-color:var(--tranquilo)}
  .modal-acoes{display:flex;gap:10px;margin-top:22px}
  .modal-acoes .btn{margin-top:0}
  .btn-sec{background:rgba(255,255,255,.08);color:var(--txt)}

  .carregando{min-height:100dvh;display:flex;align-items:center;justify-content:center;color:var(--txt-dim)}
  .oculto{display:none!important}
</style>
</head>
<body>

<!-- CÉU ENTERGALACTIC -->
<div class="ceu">
  <svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1b0f38"/>
        <stop offset="0.42" stop-color="#5b2170"/>
        <stop offset="0.62" stop-color="#b23a7a"/>
        <stop offset="0.78" stop-color="#f06b3e"/>
        <stop offset="1" stop-color="#fbbf24"/>
      </linearGradient>
      <radialGradient id="orb" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#fff3d6"/>
        <stop offset="0.5" stop-color="#fcae4a"/>
        <stop offset="1" stop-color="#f06b3e" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="400" height="800" fill="url(#sky)"/>
    <circle cx="200" cy="500" r="150" fill="url(#orb)" opacity="0.9"/>
    <circle cx="200" cy="500" r="62" fill="#fff1cf" opacity="0.95"/>
    <!-- estrelas -->
    <g fill="#fff">
      <circle cx="40" cy="60" r="1.4" opacity=".9"/><circle cx="120" cy="110" r="1" opacity=".6"/>
      <circle cx="300" cy="70" r="1.6" opacity=".85"/><circle cx="350" cy="150" r="1" opacity=".5"/>
      <circle cx="70" cy="180" r="1.1" opacity=".7"/><circle cx="230" cy="130" r="1.2" opacity=".65"/>
      <circle cx="180" cy="50" r="1" opacity=".55"/><circle cx="330" cy="220" r="1.3" opacity=".6"/>
      <circle cx="20" cy="260" r="1" opacity=".5"/><circle cx="270" cy="200" r="1.1" opacity=".55"/>
    </g>
    <!-- colinas -->
    <path d="M0 640 Q100 580 200 630 T400 620 V800 H0 Z" fill="#3d1a54" opacity="0.9"/>
    <path d="M0 700 Q120 650 230 700 T400 690 V800 H0 Z" fill="#2a1140"/>
    <path d="M0 760 Q160 720 280 760 T400 750 V800 H0 Z" fill="#1b0c2e"/>
  </svg>
</div>
<div class="grao"></div>

<!-- CARREGANDO -->
<div id="tela-load" class="carregando">Acordando a Zaia…</div>

<!-- LOGIN -->
<div id="tela-login" class="login-wrap oculto">
  <div class="login-card">
    <div class="marca">Zaia</div>
    <div class="marca-sub">sua mordoma de tarefas 🌙</div>
    <input id="li-email" class="campo" type="email" placeholder="seu e-mail" autocomplete="email"/>
    <input id="li-senha" class="campo" type="password" placeholder="sua senha" autocomplete="current-password"/>
    <button id="btn-entrar" class="btn btn-primario">Entrar</button>
    <button id="btn-criar" class="btn btn-ghost">criar uma conta</button>
    <div class="divisor">ou</div>
    <button id="btn-google" class="btn btn-google">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.2 13.6 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.6c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7c4.3-3.9 6.8-9.7 6.8-17.4z"/><path fill="#FBBC05" d="M10.4 28.3c-.5-1.5-.8-3.1-.8-4.8s.3-3.3.8-4.8l-7.8-6.1C1 15.9 0 19.8 0 24s1 8.1 2.6 11.4l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.5-2 15.3-5.5l-7.3-5.7c-2 1.4-4.7 2.3-8 2.3-6.4 0-11.8-4.1-13.7-9.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Continuar com Google
    </button>
    <div id="li-erro" class="erro"></div>
  </div>
</div>

<!-- APP -->
<div id="tela-app" class="app oculto">
  <div class="topo">
    <div class="saudacao">
      <h1 id="ola">Oi 🌙</h1>
      <p id="resumo-linha">…</p>
    </div>
    <div class="menu-user">
      <button id="btn-notif" class="icon-btn" title="Ativar lembretes">🔔</button>
      <div id="avatar" class="avatar">E</div>
      <button id="btn-sair" class="icon-btn" title="Sair">⏻</button>
    </div>
  </div>

  <!-- barra Zaia -->
  <div class="zaia-bar">
    <input id="cmd" placeholder="Fala comigo… ex: reunião com a oficina amanhã 15h" />
    <button id="cmd-send" class="zaia-send">➤</button>
  </div>
  <div id="zaia-fala" class="zaia-fala hint">Escreve do seu jeito que eu me viro. 💫</div>

  <!-- abas -->
  <div class="aba-nav">
    <button data-aba="hoje" class="ativa">Hoje</button>
    <button data-aba="tarefas">Tarefas</button>
    <button data-aba="projetos">Projetos</button>
    <button data-aba="voce">Você</button>
  </div>

  <!-- ABA HOJE -->
  <section id="aba-hoje">
    <div class="foco">
      <h2>✨ Foco de hoje</h2>
      <div id="lista-foco"></div>
    </div>
    <div class="sec-titulo">Vencendo em breve</div>
    <div id="lista-breve"></div>
  </section>

  <!-- ABA TAREFAS -->
  <section id="aba-tarefas" class="oculto">
    <div id="lista-tarefas"></div>
  </section>

  <!-- ABA PROJETOS -->
  <section id="aba-projetos" class="oculto">
    <button id="btn-novo-proj" class="mini-btn" style="margin-bottom:14px">+ Novo projeto</button>
    <div id="lista-projetos"></div>
  </section>

  <!-- ABA VOCE -->
  <section id="aba-voce" class="oculto">
    <div class="stats-grid" id="stats"></div>
    <div class="sec-titulo">O que a Zaia aprendeu com você</div>
    <div id="lista-sinonimos"></div>
    <div class="add-etapa" style="margin-top:12px">
      <input id="sin-termo" placeholder="palavra (ex: oficina)"/>
      <input id="sin-signif" placeholder="= etiqueta (ex: trabalho)"/>
      <button id="sin-add" class="mini-btn">Ensinar</button>
    </div>
    <button id="btn-exportar" class="btn btn-sec" style="margin-top:22px">⬇ Exportar meus dados</button>
  </section>
</div>

<!-- FAB -->
<button id="fab" class="fab oculto">+</button>

<!-- MODAL TAREFA -->
<div id="modal-tarefa" class="modal-bg">
  <div class="modal">
    <h3 id="modal-titulo">Nova tarefa</h3>
    <input type="hidden" id="m-id"/>
    <label>O quê?</label>
    <input id="m-titulo" class="campo" placeholder="ex: revisar capítulo 2 do TCC"/>
    <label>Prioridade</label>
    <div class="prio-pick" id="m-prio">
      <button data-p="urgente">🔴 Urgente</button>
      <button data-p="importante" class="sel">🟡 Importante</button>
      <button data-p="tranquilo">🟢 Tranquilo</button>
    </div>
    <label>Prazo (opcional)</label>
    <input id="m-prazo" class="campo" type="datetime-local"/>
    <label>Etiqueta (opcional)</label>
    <input id="m-etiqueta" class="campo" placeholder="trabalho, casa, faculdade…"/>
    <div class="modal-acoes">
      <button id="m-cancelar" class="btn btn-sec">Cancelar</button>
      <button id="m-salvar" class="btn btn-primario">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL PROJETO -->
<div id="modal-proj" class="modal-bg">
  <div class="modal">
    <h3>Novo projeto</h3>
    <label>Nome</label>
    <input id="p-nome" class="campo" placeholder="ex: TCC"/>
    <label>Prazo final (opcional)</label>
    <input id="p-prazo" class="campo" type="date"/>
    <div class="modal-acoes">
      <button id="p-cancelar" class="btn btn-sec">Cancelar</button>
      <button id="p-salvar" class="btn btn-primario">Criar</button>
    </div>
  </div>
</div>

<script type="module">

  onSnapshot, query, where }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

/* ===== HELPERS DATA ===== */
const DIA=86400000;
function hojeZero(){const d=new Date();d.setHours(0,0,0,0);return d.getTime();}
function fmtPrazo(ms){
  if(!ms) return null;
  const d=new Date(ms), hj=hojeZero(), dd=new Date(ms);dd.setHours(0,0,0,0);
  const dif=Math.round((dd.getTime()-hj)/DIA);
  const hora=(d.getHours()||d.getMinutes())?` ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`:'';
  let base;
  if(dif===0)base='hoje';else if(dif===1)base='amanhã';else if(dif===-1)base='ontem';
  else if(dif>1&&dif<7)base=['dom','seg','ter','qua','qui','sex','sáb'][d.getDay()];
  else base=`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
  return base+hora;
}
const venceu=ms=>ms&&ms<Date.now();

/* score de urgência: combina prioridade + proximidade do prazo */
function score(t){
  const peso={urgente:100,importante:50,tranquilo:10}[t.prioridade]||50;
  let p=0;
  if(t.prazo){
    const dias=(t.prazo-Date.now())/DIA;
    if(dias<0)p=200; else if(dias<1)p=120; else if(dias<3)p=70; else if(dias<7)p=35; else p=10;
  }
  return peso+p;
}

  el('lista-breve').innerHTML=b.length?b.map(itemTarefa).join(''):'<div class="vazio">Sem prazos nos próximos 7 dias.</div>';

  const feitas=tarefas.filter(t=>t.concluida).sort((a,b)=>(b.criadaEm||0)-(a.criadaEm||0)).slice(0,15);

/* ===== O CÉREBRO DA ZAIA (parser) ===== */
el('cmd-send').onclick=processar;
el('cmd').addEventListener('keydown',e=>{if(e.key==='Enter')processar();});
function fala(txt,alerta){const f=el('zaia-fala');f.textContent=(alerta?'':'🌙 ')+txt;f.classList.toggle('hint',false);}

const DIAS_SEM={'domingo':0,'segunda':1,'terça':2,'terca':2,'quarta':3,'quinta':4,'sexta':5,'sábado':6,'sabado':6};

async function processar(){
  const bruto=el('cmd').value.trim(); if(!bruto)return;
  const txt=bruto.toLowerCase();
  el('cmd').value='';

  // 1) consultas
  if(/\b(foco|o que|oq|tenho).*(hoje|agora|fazer)\b/.test(txt)||/\bhoje\?$/.test(txt)){
    const f=tarefas.filter(t=>!t.concluida).sort((a,b)=>score(b)-score(a)).slice(0,3);
    document.querySelector('.aba-nav button[data-aba="hoje"]').click();
    return fala(f.length?`Seu foco: ${f.map(t=>'“'+t.titulo+'”').join(', ')}.`:'Nada na fila. Respira. 😌');
  }
  if(/\b(resumo|como (eu )?estou|progresso|quanto falta)\b/.test(txt)){
    const ab=tarefas.filter(t=>!t.concluida).length, at=tarefas.filter(t=>!t.concluida&&venceu(t.prazo)).length;
    return fala(`${ab} em aberto${at?`, sendo ${at} atrasada${at>1?'s':''}`:''}. ${at?'Bora atacar as atrasadas primeiro.':'Tá indo bem. ✨'}`);
  }
  // 2) ensinar
  let m=txt.match(/(?:ensina[r]?|aprende[r]?|quando eu falar)[:\s]+["']?(.+?)["']?\s*(?:=|é|eh|significa|quer dizer|:)\s*(.+)/);
  if(m){
    await addDoc(collection(db,'sinonimos'),{termo:m[1].trim(),significado:m[2].trim(),tipo:'etiqueta',userId:user.uid,criadaEm:Date.now()});
    return fala(`Anotado: quando você falar “${m[1].trim()}”, entendo como ${m[2].trim()}. 🧠`);
  }
  // 3) concluir
  m=txt.match(/^(conclu[ií]r?|termin(?:ei|ar)|feito|fiz|finaliz(?:ei|ar)|acabei)\s+(?:a |o |de |com )?(.+)/);
  if(m){
    const alvo=acharTarefa(m[2]);
    if(alvo){await updateDoc(doc(db,'tarefas',alvo.id),{concluida:true,concluidaEm:Date.now()});return fala(`Boa! “${alvo.titulo}” concluída. ✅`);}
    return fala('Não achei essa tarefa pra concluir. 🤔');
  }
  // 4) apagar
  m=txt.match(/^(apag(?:ar|a)|exclu(?:ir|i)|remov(?:er|e)|delet(?:ar|a))\s+(?:a |o )?(.+)/);
  if(m){
    const alvo=acharTarefa(m[2]);
    if(alvo){await del('tarefas',alvo.id);return fala(`“${alvo.titulo}” apagada. 🗑`);}
    return fala('Não encontrei essa tarefa pra apagar.');
  }
  // 5) adiar
  m=txt.match(/^(adia[r]?|remarca[r]?|mud[ae][r]?)\s+(.+?)\s+(?:pra|para|pro)\s+(.+)/);
  if(m){
    const alvo=acharTarefa(m[2]);
    if(!alvo)return fala('Não achei essa tarefa pra remarcar.');
    const {data}=parseData(m[3]);
    if(!data)return fala('Não entendi a nova data. Tenta “...pra sexta” ou “...pra dia 10”.');
    await updateDoc(doc(db,'tarefas',alvo.id),{prazo:data.getTime(),lembrete:data.getTime()});
    return fala(`Pronto, “${alvo.titulo}” remarcada pra ${fmtPrazo(data.getTime())}. 🗓️`);
  }
  // 6) criar tarefa (default)
  criarPorTexto(bruto);
}

function acharTarefa(q){
  q=q.trim().toLowerCase();
  const abertas=tarefas.filter(t=>!t.concluida);
  let hit=abertas.find(t=>t.titulo.toLowerCase()===q);
  if(hit)return hit;
  hit=abertas.find(t=>t.titulo.toLowerCase().includes(q));
  if(hit)return hit;
  const palavras=q.split(/\s+/).filter(w=>w.length>2);
  let melhor=null,ptos=0;
  abertas.forEach(t=>{const tl=t.titulo.toLowerCase();const n=palavras.filter(w=>tl.includes(w)).length;if(n>ptos){ptos=n;melhor=t;}});
  return ptos>0?melhor:null;
}

function criarPorTexto(bruto){
  let txt=bruto;
  const low=txt.toLowerCase();
  // prioridade
  let prioridade='importante';
  if(/\burgente\b|\basap\b|\bpra ontem\b/i.test(low))prioridade='urgente';
  else if(/\btranquilo\b|\bsem pressa\b|\bqualquer hora\b|\bquando der\b/i.test(low))prioridade='tranquilo';
  // etiqueta: sinônimos ensinados + padrões
  let etiqueta=null;
  for(const s of sinonimos){ if(s.tipo==='etiqueta'&&low.includes(s.termo.toLowerCase())){etiqueta=s.significado;break;} }
  if(!etiqueta){
    if(/\b(tcc|prova|aula|faculdade|uni|monografia|artigo|professora?)\b/.test(low))etiqueta='faculdade';
    else if(/\b(reuni[ãa]o|frota|oficina|relat[óo]rio|planilha|chefe|trabalho|os\b)/.test(low))etiqueta='trabalho';
    else if(/\b(mercado|boleto|conta|casa|m[ãa]e|remédio|farm[áa]cia|comprar)\b/.test(low))etiqueta='casa';
  }
  // data/hora
  const {data,limpo}=parseData(txt);
  // limpar título
  let titulo=(limpo||txt)
    .replace(/^(criar?|adiciona[r]?|anota[r]?|marca[r]?|lembra[r]? de|preciso|tenho que|me lembra de)\s+/i,'')
    .replace(/\b(urgente|sem pressa|tranquilo|qualquer hora|quando der|asap)\b/ig,'')
    .replace(/\s{2,}/g,' ').trim();
  titulo=titulo.charAt(0).toUpperCase()+titulo.slice(1);
  if(!titulo){fala('Não peguei bem — quer abrir o formulário?');return abrirNova({prioridade});}
  const prazo=data?data.getTime():null;
  addDoc(collection(db,'tarefas'),{titulo,prioridade,etiqueta,prazo,lembrete:prazo,userId:user.uid,concluida:false,criadaEm:Date.now()});
  const quando=prazo?` pra ${fmtPrazo(prazo)}`:'';
  const et=etiqueta?` [${etiqueta}]`:'';
  fala(`Feito. Anotei “${titulo}”${quando}${et}. ${prioridade==='urgente'?'Marquei como urgente. 🔴':'🌙'}`);
}

/* parse de datas em PT-BR. retorna {data:Date|null, limpo:string} */
function parseData(texto){
  let s=texto, low=texto.toLowerCase(), data=null, tirar=[];
  const agora=new Date();
  const mk=(dd)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+dd);return d;};

  // hora primeiro (guarda pra aplicar depois)
  let hh=null,mm=0,mhora=low.match(/\b(?:às?\s*)?(\d{1,2})(?:[:h](\d{2}))?\s*(?:h|horas?)?\b/);
  // relativos
  if(/\bdepois de amanh[ãa]\b/.test(low)){data=mk(2);tirar.push(/depois de amanh[ãa]/i);}
  else if(/\bamanh[ãa]\b/.test(low)){data=mk(1);tirar.push(/amanh[ãa]/i);}
  else if(/\bhoje\b/.test(low)){data=mk(0);tirar.push(/hoje/i);}
  else if(/\bsemana que vem\b|\bpr[óo]xima semana\b/.test(low)){data=mk(7);tirar.push(/semana que vem|pr[óo]xima semana/i);}
  // dia da semana
  if(!data){
    for(const [nome,idx] of Object.entries(DIAS_SEM)){
      if(new RegExp(`\\b${nome}\\b`).test(low)){
        let dif=(idx-agora.getDay()+7)%7; if(dif===0)dif=7;
        data=mk(dif);tirar.push(new RegExp(`(?:na |próxima |pr[óo]xima )?${nome}(?:-feira)?`,'i'));break;
      }
    }
  }
  // dd/mm(/aaaa)
  let mdata=low.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
  if(!data&&mdata){
    let ano=mdata[3]?(mdata[3].length===2?2000+ +mdata[3]:+mdata[3]):agora.getFullYear();
    data=new Date(ano,+mdata[2]-1,+mdata[1]);data.setHours(0,0,0,0);
    if(!mdata[3]&&data.getTime()<hojeZero())data.setFullYear(ano+1);
    tirar.push(new RegExp(mdata[0].replace(/\//g,'\\/')));
  }
  // "dia N"
  let mdia=low.match(/\bdia\s+(\d{1,2})\b/);
  if(!data&&mdia){
    let dnum=+mdia[1],d=new Date();d.setHours(0,0,0,0);d.setDate(dnum);
    if(d.getTime()<hojeZero())d.setMonth(d.getMonth()+1);
    data=d;tirar.push(/dia\s+\d{1,2}/i);
  }
  // aplica hora
  if(mhora&&/\b(\d{1,2})[:h]|\bàs?\s*\d|\d\s*h(oras?)?\b/.test(low)){
    hh=+mhora[1]; if(mhora[2])mm=+mhora[2];
    if(hh>=0&&hh<=23){ if(!data)data=mk(0); data.setHours(hh,mm,0,0); tirar.push(new RegExp(mhora[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'));
      if(data.getTime()<Date.now()-60000 && !mdata && !mdia && !/amanh|hoje|semana|segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado|domingo/.test(low)) data.setDate(data.getDate()+1);
    }
  }
  let limpo=s;
  tirar.forEach(rx=>limpo=limpo.replace(rx,''));
  limpo=limpo.replace(/\b(às?|para|pra|pro|no dia|em)\b/ig,'').replace(/\s{2,}/g,' ').trim();
  return {data,limpo};
}

/* ===== LEMBRETES ===== */
el('btn-notif').onclick=async()=>{
  if(!('Notification'in window))return fala('Seu navegador não suporta notificações.');
  const p=await Notification.requestPermission();
  fala(p==='granted'?'Lembretes ativados! Vou te avisar na hora. 🔔':'Sem permissão pros lembretes. 😢');
};
setInterval(()=>{
  if(Notification?.permission!=='granted')return;
  const agora=Date.now();
  tarefas.forEach(t=>{
    if(t.lembrete&&!t.concluida&&!notificadas.has(t.id)&&t.lembrete<=agora&&t.lembrete>agora-3600000){
      notificadas.add(t.id);
      new Notification('Zaia 🌙',{body:t.titulo,tag:t.id});
    }
  });
},30000);
